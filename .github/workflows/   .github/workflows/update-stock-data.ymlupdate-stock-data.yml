# .github/workflows/update-stock-data.yml
#
# อัปเดตข้อมูลหุ้นเข้า Turso อัตโนมัติวันละ 3 ครั้ง
# เวลาไทย: 10:00 น., 13:00 น. และ 16:00 น.
#
# ทำงาน 2 แบบ:
#   1. อัตโนมัติ จันทร์-ศุกร์
#   2. กดรันเองได้จากแท็บ Actions บน GitHub

name: Update Stock Data

on:
  schedule:
    # GitHub Actions ใช้เวลา UTC
    # 03:00 UTC = 10:00 น. เวลาไทย
    # 06:00 UTC = 13:00 น. เวลาไทย
    # 09:00 UTC = 16:00 น. เวลาไทย
    - cron: '0 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 9 * * 1-5'

  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install yfinance financedatabase pandas

      - name: Install Node dependencies
        run: npm install

      - name: Fetch latest stock data from Yahoo Finance
        run: python fetch_set_data.py --output set_data.json

      - name: Import into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node import_stock_data.js
